<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Digital Lost & Found</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <div class="title-box">
    <h1>Digital Lost & Found System</h1>
    <p>Helping People Reconnect With Their Belongings</p>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>
</header>

<div class="container">

<div class="card lost-card">
<h2>Report Lost Item</h2>

<form onsubmit="addLost(event)">
<input type="text" id="lostName" placeholder="Item Name" required>
<input type="text" id="lostLocation" placeholder="Last Seen Location">
<input type="date" id="lostDate">
<textarea id="lostDesc" placeholder="Item Description"></textarea>
<input type="text" id="lostContact" placeholder="Contact Number">
<button type="submit">Submit Lost</button>
</form>
</div>

<div class="card found-card">
<h2>Report Found Item</h2>

<form onsubmit="addFound(event)">
<input type="text" id="foundName" placeholder="Item Name" required>
<input type="text" id="foundLocation" placeholder="Found Location">
<input type="date" id="foundDate">
<textarea id="foundDesc" placeholder="Item Description"></textarea>
<input type="text" id="foundContact" placeholder="Contact Number">
<button type="submit">Submit Found</button>
</form>
</div>

</div>

<div class="reports-section">

<h2 class="report-title">Submitted Reports</h2>

<div id="reportList"></div>

</div>

<div id="msgBox" class="message-box"></div>

<!-- Firebase SDK -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyA4Oew3QeYdju6YkphVQFAhfSHUom4Mka8",
 authDomain: "digital-lost-found.firebaseapp.com",
 projectId: "digital-lost-found",
 storageBucket: "digital-lost-found.firebasestorage.app",
 messagingSenderId: "232236131696",
 appId: "1:232236131696:web:ee80a442378d1551d15bb5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Auth Protection
onAuthStateChanged(auth, (user)=>{
if(!user){
window.location.href="login.html";
}
});

// Logout
window.logout = function(){
signOut(auth);
}

// Message UI
function showMessage(text){
let box=document.getElementById("msgBox");
box.innerText=text;
box.className="message-box show success";

setTimeout(()=>{
box.className="message-box";
},3000);
}

// Add Lost
window.addLost = async function(e){
e.preventDefault();

await addDoc(collection(db,"reports"),{
type:"Lost",
name:lostName.value,
location:lostLocation.value,
date:lostDate.value,
desc:lostDesc.value,
contact:lostContact.value,
time:serverTimestamp()
});

showMessage("Lost Item Submitted");
e.target.reset();
}

// Add Found
window.addFound = async function(e){
e.preventDefault();

await addDoc(collection(db,"reports"),{
type:"Found",
name:foundName.value,
location:foundLocation.value,
date:foundDate.value,
desc:foundDesc.value,
contact:foundContact.value,
time:serverTimestamp()
});

showMessage("Found Item Submitted");
e.target.reset();
}

// Load Reports Live
const q = query(collection(db,"reports"), orderBy("time","desc"));

onSnapshot(q,(snapshot)=>{

let box=document.getElementById("reportList");
box.innerHTML="";

snapshot.forEach(doc=>{

let i = doc.data();

box.innerHTML+=`
<div class="report-card">
<h3>${i.type} - ${i.name}</h3>
<p><b>Location:</b> ${i.location}</p>
<p><b>Date:</b> ${i.date}</p>
<p><b>Description:</b> ${i.desc}</p>
<p><b>Contact:</b> ${i.contact}</p>
</div>
`;

});

});

</script>

</body>
</html>
