<!DOCTYPE html>
<html>
<head>
<title>Login</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card auth-card">

<h2>User Login</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<br>

<p class="auth-link">
New User?
<a href="register.html">Create Account</a>
</p>

<div id="loginMsg" class="message-box"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4Oew3QeYdju6YkphVQFAhfSHUom4Mka8",
  authDomain: "digital-lost-found.firebaseapp.com",
  projectId: "digital-lost-found",
  storageBucket: "digital-lost-found.appspot.com",
  messagingSenderId: "232236131696",
  appId: "1:232236131696:web:ee80a442378d1551d15bb5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.login = function(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;
let msg = document.getElementById("loginMsg");

signInWithEmailAndPassword(auth, email, password)
.then(() => {

msg.innerText = "Login Successful!";
msg.className = "message-box show success";

setTimeout(()=>{
window.location.href="index.html";
},1200);

})
.catch(error => {

msg.innerText = error.message;
msg.className = "message-box show error";

});

}

</script>

</body>
</html>
