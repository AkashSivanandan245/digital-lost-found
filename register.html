<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card auth-card">

<h2>Create Account</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="register()">Register</button>

<br>

<p class="auth-link">
Already Registered?
<a href="login.html">Login</a>
</p>

<div id="regMsg" class="message-box"></div>

</div>

<script>

function register(){

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

let msg=document.getElementById("regMsg");

if(name==""||email==""||password==""){
msg.innerText="All fields required!";
msg.className="message-box show error";
return;
}

let users=JSON.parse(localStorage.getItem("users")) || [];

let exist=users.find(u=>u.email===email);

if(exist){
msg.innerText="User already exists!";
msg.className="message-box show error";
return;
}

users.push({name,email,password});
localStorage.setItem("users",JSON.stringify(users));

msg.innerText="Registration Successful!";
msg.className="message-box show success";

setTimeout(()=>{
window.location.href="login.html";
},1200);

}

</script>

</body>
</html>
