<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card auth-card">

<h2>Create Account</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="register()">Register</button>

<br>

<p class="auth-link">
Already Registered?
<a href="login.html">Login</a>
</p>

<div id="regMsg" class="message-box"></div>

</div>

<!-- Firebase SDK -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
 apiKey: "AIzaSyA4Oew3QeYdju6YkphVQFAhfSHUom4Mka8",
 authDomain: "digital-lost-found.firebaseapp.com",
 projectId: "digital-lost-found",
 storageBucket: "digital-lost-found.firebasestorage.app",
 messagingSenderId: "232236131696",
 appId: "1:232236131696:web:ee80a442378d1551d15bb5"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;
let msg = document.getElementById("regMsg");

createUserWithEmailAndPassword(auth, email, password)
.then(() => {

msg.innerText = "Registration Successful!";
msg.className = "message-box show success";

setTimeout(()=>{
window.location.href="login.html";
},1200);

})
.catch(error => {

msg.innerText = error.message;
msg.className = "message-box show error";

});

}

</script>

</body>
</html>
