<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="card auth-card">

<h2>Create Account</h2>

<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Password">

<button onclick="register()">Register</button>

<br>

<p class="auth-link">
Already Registered?
<a href="login.html">Login</a>
</p>

<div id="regMsg" class="message-box"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBb6me0mkpmWy-BAUzZxiETS68d6RR_H-Y",
  authDomain: "hackathon-project-1a58b.firebaseapp.com",
  projectId: "hackathon-project-1a58b",
  storageBucket: "hackathon-project-1a58b.appspot.com",
  messagingSenderId: "349890140099",
  appId: "1:349890140099:web:368260f25c16c9f28f4f76"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.register = function(){

let email = document.getElementById("email").value;
let password = document.getElementById("password").value;
let msg = document.getElementById("regMsg");

createUserWithEmailAndPassword(auth, email, password)
.then(() => {

msg.innerText = "Registration Successful!";
msg.className = "message-box show success";

setTimeout(()=>{
window.location.href="login.html";
},1000);

})
.catch(error => {

msg.innerText = error.message;
msg.className = "message-box show error";

});

}

</script>

</body>
</html>
